profile_id = "architecture-publisher"

[openspec]
material_paths = [
    "**",
]

[proof]
code_correctness_gates = ["node-behavior", "node-static", "node-package"]

[proof.code_correctness_map]
behavior = "node-behavior"
static-analysis = "node-static"

[[proof.gates]]
id = "node-behavior"
kind = "test"
providers = ["ethos.adapters.gates.code_quality:behavior_report"]
dimensions = ["behavior", "test", "coverage"]
execution_mode = "provider"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "ethos"
profile = "repository"
writes_files = true
network_policy = "offline"

[[proof.gates]]
id = "node-static"
kind = "syntax"
command = ["npm", "run", "check:static"]
verification_providers = ["ethos.adapters.gates.code_quality:static_report"]
dimensions = ["static-analysis"]
execution_mode = "subprocess"
evidence_class = "contract"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"

[[proof.gates]]
id = "node-package"
kind = "package"
command = ["npm", "run", "check:package"]
dimensions = ["package", "installability"]
execution_mode = "subprocess"
evidence_class = "proof"
trust_bearing = true
tool_adapter = "repository-native"
network_policy = "offline"
