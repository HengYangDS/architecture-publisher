[protected_refs]
branches = ["main", "dev"]
tags = ["v*"]

[publication]
local_verification_command = "npm run check"
local_installation_command = "node --test tests/installed-cli.test.mjs"

[[publication.peers]]
id = "gitlab"
provider = "gitlab"
role = "private_source_projection"
git_remote = "origin"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".gitlab-ci.yml"
