[protected_refs]
branches = ["main", "dev"]
tags = ["v0.1.0-alpha.0", "v0.1.0-alpha.1", "v0.1.0-alpha.2", "v0.1.0-alpha.3", "v0.1.0-alpha.4", "v0.1.0-alpha.5", "v0.1.0-alpha.6", "v0.1.0-alpha.7"]

[publication]
local_verification_command = "npm test"
local_installation_command = "node --test tests/installed-cli.test.mjs"

[[publication.peers]]
id = "gitlab"
provider = "gitlab"
role = "private_source_projection"
git_remote = "origin"
capabilities = ["repository", "publication"]
