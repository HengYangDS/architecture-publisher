[protected_refs]
tags = ["v*"]

[publication]
local_verification_command = "npm run check"
local_installation_command = "node --test tests/installed-cli.test.mjs"

[[publication.peers]]
id = "gitlab"
provider = "gitlab"
role = "private_source_projection"
git_remote = "gitlab"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".gitlab-ci.yml"

[[publication.peers]]
id = "github"
provider = "github"
role = "private_source_projection"
git_remote = "github"
capabilities = ["repository", "ci_cd", "publication"]
ci_surface = ".github/workflows/verify.yml"
forge_repository = "https://github.com/HengYangDS/architecture-publisher"
