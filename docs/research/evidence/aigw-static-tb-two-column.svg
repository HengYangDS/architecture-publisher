<title id="static-figure-title">AIGW — Control, Effects and Delivery</title>
<desc id="static-figure-description">AIGW controls provider and client configuration; native clients and selected external services own request traffic. Source-attributed architecture, not an implementation audit. Editorial framing by aigw-cli · source endorsement not evidenced here</desc>
