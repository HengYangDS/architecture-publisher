workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

image:
  name: hengyang2003/architecture-publisher-ci@sha256:aa3b5007ac1803793b3bd33829aa1c79f08a7437c146db963b2654ed8dd75e4e

variables:
  GIT_DEPTH: '0'
  MISE_ENV: ci
  MISE_LOCKED: '1'
  MISE_DATA_DIR: '$CI_PROJECT_DIR/build/runtime/tool-cache/mise'
  MISE_CACHE_DIR: '$CI_PROJECT_DIR/build/runtime/tool-cache/mise/cache'
  MISE_TRUSTED_CONFIG_PATHS: '$CI_PROJECT_DIR'
  PLAYWRIGHT_BROWSERS_PATH: '$CI_PROJECT_DIR/build/runtime/tool-cache/playwright'

stages:
  - verify

.verify-native:
  stage: verify
  interruptible: true
  timeout: 60m
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/coverage-summary.json
  script:
    - mise --version
    - mise install
    - mise exec -- rustup component add rust-std
    - mise exec -- node --version
    - mise exec -- npm --version
    - git --version
    - mise exec -- npm ci --ignore-scripts --no-audit --no-fund
    - mise exec -- node node_modules/playwright-core/cli.js install chromium
    - >-
      mise exec -- node --import=./tests/fixtures/npm-environment.mjs --test
      --test-name-pattern='standalone reader policy blocks dynamic page connections'
      tests/interactive-html.test.mjs
    - mise exec -- node -e "require('node:fs').mkdirSync('build/runtime/tool-cache/raster',{recursive:true})"
    - mise exec -- node tools/raster/resvg/verify.mjs --registry-url > build/runtime/tool-cache/raster/source-url.txt
    - >-
      curl --fail --silent --show-error --connect-timeout 15 --max-time 180
      --variable source@build/runtime/tool-cache/raster/source-url.txt
      --expand-url "{{source:trim}}" --variable %CI_JOB_TOKEN
      --expand-header "JOB-TOKEN: {{CI_JOB_TOKEN}}"
      --output build/runtime/tool-cache/raster/source.tar.xz
    - mise exec -- node tools/raster/resvg/verify.mjs --archive build/runtime/tool-cache/raster/source.tar.xz
    - mise exec -- node --test tests/conformance/journeys/raster/rebuild.test.mjs
    - mise exec -- npm run check

.verify-linux:
  extends: .verify-native
  variables:
    FF_USE_INIT_WITH_DOCKER_EXECUTOR: 'true'
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: 'true'
    PIXI_HOME: '$CI_PROJECT_DIR/build/runtime/work/native-linux-prerequisites/home'
    PIXI_CACHE_DIR: '$CI_PROJECT_DIR/build/runtime/tool-cache/pixi'
  before_script:
    - umask 022
    - test "$(uname -sm)" = "Linux aarch64"
    - test "$(id -u)" != "0"
    - mkdir -p build/runtime/tool-cache/mise-bootstrap
    - >-
      curl --fail --silent --show-error --location --connect-timeout 15 --max-time 180
      --output build/runtime/tool-cache/mise-bootstrap/mise.tar.gz
      https://github.com/jdx/mise/releases/download/v2026.10.2/mise-v2026.10.2-linux-arm64.tar.gz
    - echo '5d3368679ce0cc37fb222511a04c61426cded69f0cda0f8248d03970dc34f303  build/runtime/tool-cache/mise-bootstrap/mise.tar.gz' | sha256sum --check
    - tar -xzf build/runtime/tool-cache/mise-bootstrap/mise.tar.gz -C build/runtime/tool-cache/mise-bootstrap --strip-components=1
    - export PATH="$CI_PROJECT_DIR/build/runtime/tool-cache/mise-bootstrap/bin:$PATH"
    - mkdir -p "$PIXI_HOME" build/runtime/work/native-linux-prerequisites
    - cp .config/ci/linux/pixi.toml .config/ci/linux/pixi.lock build/runtime/work/native-linux-prerequisites/
    - cp .config/ci/linux/pixi-config.toml "$PIXI_HOME/config.toml"
    - mise exec -- pixi shell-hook --locked --shell bash --manifest-path build/runtime/work/native-linux-prerequisites/pixi.toml > build/runtime/work/native-linux-prerequisites/activation.bash
    - . build/runtime/work/native-linux-prerequisites/activation.bash
    - xz --version
    - '"$CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER" --version'

verify:linux:review:
  extends: .verify-linux
  tags:
    - ci-linux-arm64-container
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:linux:protected:
  extends: .verify-linux
  tags:
    - ci-linux-arm64-container-protected
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

.verify-macos:
  extends: .verify-native
  image: null
  resource_group: native-macos-verification
  before_script:
    - umask 022
    - test "$(uname -sm)" = "Darwin arm64"

verify:macos:review:
  extends: .verify-macos
  tags:
    - ci-macos-arm64-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:macos:protected:
  extends: .verify-macos
  tags:
    - ci-macos-arm64-shell
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

.verify-windows:
  extends: .verify-native
  image: null
  resource_group: native-windows-verification
  interruptible: true
  timeout: 60m
  variables:
    GIT_STRATEGY: fetch
    GIT_CLEAN_FLAGS: '-ffdx -e build/runtime/tool-cache/'
  before_script:
    - git checkout-index --all --force
    - '$env:PATH = (Join-Path $env:ProgramFiles "mise/bin") + [IO.Path]::PathSeparator + $env:PATH'
    - node -e "if (process.platform !== 'win32' || process.arch !== 'arm64') process.exit(1)"

verify:windows:review:
  extends: .verify-windows
  tags:
    - ci-windows-arm64-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:windows:protected:
  extends: .verify-windows
  tags:
    - ci-windows-arm64-shell
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

diagnose:windows:browser-loader:
  extends: .verify-windows
  tags:
    - ci-windows-arm64-review
  timeout: 3m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/evidence/windows-browser-loader-$CI_JOB_ID/
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $record = [ordered]@{ schemaVersion = 1; job = $env:CI_JOB_ID; sha = $env:CI_COMMIT_SHA; retirement = 'Review uploaded receipt and profile custody, then remove this temporary job; retain failed evidence' }
      $directory = Join-Path $env:CI_PROJECT_DIR ('build/evidence/windows-browser-loader-' + $env:CI_JOB_ID)
      [IO.Directory]::CreateDirectory($directory) | Out-Null
      $target = Join-Path $directory 'receipt.json'
      $process = $null
      $members = @()
      try {
        $record.identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
        if ($record.identity -ne 'NT SERVICE\gitlab-runner-p1323-windows-review') { throw 'Unexpected diagnostic service identity' }
        mise exec -- npm ci --ignore-scripts --no-audit --no-fund
        $record.packageSupplyExit = $LASTEXITCODE
        if ($LASTEXITCODE -ne 0) { throw 'Locked project dependency preparation failed' }
        $selected = mise exec -- node --import=./tests/fixtures/npm-environment.mjs -e "console.log(JSON.stringify({executable:process.env.ARCHPUB_BROWSER_EXECUTABLE,node:process.execPath,version:process.version,arch:process.arch}))"
        if ($LASTEXITCODE -ne 0) { throw 'Native browser selection failed' }
        $browser = $selected | ConvertFrom-Json
        $record.selected = $browser
        $parents = @()
        $parentPath = $browser.executable
        while ($parentPath) {
          $acl = Get-Acl -LiteralPath $parentPath
          $parents += [ordered]@{ path = $parentPath; owner = $acl.Owner; access = $acl.AccessToString }
          $parent = [IO.Directory]::GetParent($parentPath)
          $parentPath = if ($null -eq $parent) { $null } else { $parent.FullName }
        }
        $record.acls = $parents
        $file = Get-Item -LiteralPath $browser.executable
        $signature = Get-AuthenticodeSignature -LiteralPath $browser.executable
        $record.file = [ordered]@{ size = $file.Length; attributes = $file.Attributes.ToString(); signatureStatus = $signature.Status.ToString(); signer = $signature.SignerCertificate.Subject }
        $stream = [IO.File]::OpenRead($browser.executable)
        try {
          $reader = [IO.BinaryReader]::new($stream)
          $record.file.dosMagic = $reader.ReadUInt16()
          $stream.Position = 60
          $stream.Position = $reader.ReadUInt32()
          $record.file.peSignature = $reader.ReadUInt32()
          $record.file.machine = ('0x{0:X4}' -f $reader.ReadUInt16())
        } finally { $stream.Dispose() }
        if ($record.file.dosMagic -ne 23117 -or $record.file.peSignature -ne 17744) { throw 'Invalid executable header; loader probe not performed' }
        try {
          $record.selectedSupplyFiles = @(Get-ChildItem -LiteralPath ([IO.Path]::GetDirectoryName($browser.executable)) -File | Where-Object { $_.Extension -in @('.exe', '.dll', '.manifest') -or $_.Name -eq 'icudtl.dat' } | ForEach-Object {
            $item = [ordered]@{ name = $_.Name; size = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            if ($_.Extension -eq '.manifest') { $text = [IO.File]::ReadAllText($_.FullName); $item.manifest = $text.Substring(0, [Math]::Min(8192, $text.Length)) }
            $item
          })
        } catch { $record.selectedSupplyReadError = $_.Exception.Message }
        $profile = Join-Path $directory 'profile'
        if (Test-Path -LiteralPath $profile) { throw 'Diagnostic profile already exists' }
        $record.profile = $profile
        $process = [Diagnostics.Process]::new()
        $process.StartInfo = [Diagnostics.ProcessStartInfo]::new($browser.executable)
        $process.StartInfo.UseShellExecute = $false
        $process.StartInfo.CreateNoWindow = $true
        $process.StartInfo.RedirectStandardOutput = $true
        $process.StartInfo.RedirectStandardError = $true
        foreach ($argument in @('--headless', '--no-first-run', '--no-default-browser-check', ('--user-data-dir=' + $profile), '--dump-dom', 'about:blank')) { $process.StartInfo.ArgumentList.Add($argument) }
        $activationStartedAt = [DateTime]::UtcNow
        $record.started = $process.Start()
        $record.pid = $process.Id
        $record.created = $process.StartTime.ToUniversalTime().ToString('o')
        $stdout = $process.StandardOutput.ReadToEndAsync()
        $stderr = $process.StandardError.ReadToEndAsync()
        $record.exited = $process.WaitForExit(5000)
        $all = @(Get-CimInstance Win32_Process -Filter "Name='chrome.exe'" | Where-Object { $_.ExecutablePath -eq $browser.executable -and $_.CreationDate.ToUniversalTime() -ge $process.StartTime.ToUniversalTime() })
        $ids = @($process.Id)
        do {
          $added = @($all | Where-Object { $_.ParentProcessId -in $ids -and $_.ProcessId -notin $ids })
          $members += $added
          $ids += @($added | ForEach-Object { $_.ProcessId })
        } while ($added.Count -gt 0)
        foreach ($member in $members) {
          $observed = Get-Process -Id $member.ProcessId -ErrorAction SilentlyContinue
          if ($null -ne $observed) {
            $member | Add-Member -NotePropertyName ProbeStartTime -NotePropertyValue $observed.StartTime.ToUniversalTime().ToString('o')
            $observed.Dispose()
          }
        }
        if ($process.HasExited) { $record.exitCode = $process.ExitCode }
        if ($stdout.IsCompleted) { $text = $stdout.Result; $record.stdout = $text.Substring(0, [Math]::Min(8192, $text.Length)) }
        if ($stderr.IsCompleted) { $text = $stderr.Result; $record.stderr = $text.Substring(0, [Math]::Min(8192, $text.Length)) }
      } catch {
        $errors = @()
        $exception = $_.Exception
        while ($null -ne $exception) {
          $errors += [ordered]@{ type = $exception.GetType().FullName; hresult = $exception.HResult; nativeErrorCode = if ($exception -is [ComponentModel.Win32Exception]) { $exception.NativeErrorCode } else { $null }; message = $exception.Message }
          $exception = $exception.InnerException
        }
        $record.errors = $errors
        if (@($errors | Where-Object { $_.nativeErrorCode -eq 14001 }).Count -gt 0) {
          try {
            $filter = @{ LogName = 'Application'; ProviderName = 'SideBySide'; StartTime = $activationStartedAt.ToLocalTime(); EndTime = [DateTime]::Now }
            $record.sideBySideEvents = @(Get-WinEvent -FilterHashtable $filter -MaxEvents 20 -ErrorAction Stop | Where-Object { $_.Message -and $_.Message.Contains($browser.executable) } | Sort-Object TimeCreated | ForEach-Object {
              [ordered]@{ id = $_.Id; created = $_.TimeCreated.ToUniversalTime().ToString('o'); message = $_.Message.Substring(0, [Math]::Min(8192, $_.Message.Length)) }
            })
          } catch { $record.sideBySideReadError = $_.Exception.Message }
        }
      } finally {
        try {
          if ($null -ne $process -and $record.started) {
            if (!$process.HasExited) { $process.Kill($true) }
            $record.rootExited = $process.WaitForExit(5000)
            $survivors = @()
            $unverified = @()
            foreach ($member in $members) {
              $child = Get-Process -Id $member.ProcessId -ErrorAction SilentlyContinue
              if ($null -ne $child -and $member.ProbeStartTime -and $child.StartTime.ToUniversalTime().ToString('o') -eq $member.ProbeStartTime) {
                $child.Kill($true)
                if (!$child.WaitForExit(5000)) { $survivors += $member.ProcessId }
                $child.Dispose()
              } elseif ($null -ne $child) {
                $unverified += $member.ProcessId
                $child.Dispose()
              }
            }
            $record.observedDescendants = @($members | Select-Object ProcessId, ParentProcessId, CreationDate, ExecutablePath)
            $record.survivors = $survivors
            $record.cleanupUnverified = $unverified
            $record.cleanupScope = 'Owned root and observed attributable descendants; not arbitrary detached processes'
          }
        } catch { $record.cleanupError = $_.Exception.Message }
        if ($null -ne $process) { $process.Dispose() }
        $record | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $target -Encoding utf8
      }
      Get-Content -LiteralPath $target
