workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

image:
  name: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
  docker:
    user: pwuser

variables:
  GIT_DEPTH: '0'
  MISE_ENV: ci
  MISE_LOCKED: '1'
  MISE_DATA_DIR: '$CI_PROJECT_DIR/build/runtime/tool-cache/mise'
  MISE_TRUSTED_CONFIG_PATHS: '$CI_PROJECT_DIR'
  PLAYWRIGHT_BROWSERS_PATH: '$CI_PROJECT_DIR/build/runtime/tool-cache/playwright'

stages:
  - verify

.verify-native:
  stage: verify
  interruptible: true
  timeout: 60m
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/coverage-summary.json
      - coverage/coverage-final.json
  script:
    - mise --version
    - mise install
    - mise exec -- node --version
    - mise exec -- npm --version
    - git --version
    - mise exec -- npm ci --ignore-scripts --no-audit --no-fund
    - mise exec -- node node_modules/playwright-core/cli.js install chromium
    - mise exec -- node -e "require('node:fs').mkdirSync('build/runtime/tool-cache/raster',{recursive:true})"
    - mise exec -- node tools/raster/resvg/verify.mjs --registry-url > build/runtime/tool-cache/raster/source-url.txt
    - >-
      curl --fail --silent --show-error --connect-timeout 15 --max-time 180
      --variable source@build/runtime/tool-cache/raster/source-url.txt
      --expand-url "{{source:trim}}" --variable %CI_JOB_TOKEN
      --expand-header "JOB-TOKEN: {{CI_JOB_TOKEN}}"
      --output build/runtime/tool-cache/raster/source.tar.xz
    - mise exec -- node tools/raster/resvg/verify.mjs --archive build/runtime/tool-cache/raster/source.tar.xz
    - mise exec -- node --test tests/conformance/journeys/raster/rebuild.test.mjs
    - mise exec -- npm run check

.verify-linux:
  extends: .verify-native
  variables:
    PIXI_HOME: '$CI_PROJECT_DIR/build/runtime/work/native-linux-prerequisites/home'
    PIXI_CACHE_DIR: '$CI_PROJECT_DIR/build/runtime/tool-cache/pixi'
  before_script:
    - umask 022
    - test "$(uname -sm)" = "Linux aarch64"
    - test "$(id -u)" != "0"
    - mkdir -p build/runtime/tool-cache/mise-bootstrap
    - >-
      curl --fail --silent --show-error --location --connect-timeout 15 --max-time 180
      --output build/runtime/tool-cache/mise-bootstrap/mise.tar.gz
      https://github.com/jdx/mise/releases/download/v2026.10.2/mise-v2026.10.2-linux-arm64.tar.gz
    - echo '5d3368679ce0cc37fb222511a04c61426cded69f0cda0f8248d03970dc34f303  build/runtime/tool-cache/mise-bootstrap/mise.tar.gz' | sha256sum --check
    - tar -xzf build/runtime/tool-cache/mise-bootstrap/mise.tar.gz -C build/runtime/tool-cache/mise-bootstrap --strip-components=1
    - export PATH="$CI_PROJECT_DIR/build/runtime/tool-cache/mise-bootstrap/bin:$PATH"
    - mkdir -p "$PIXI_HOME" build/runtime/work/native-linux-prerequisites
    - cp .config/ci/linux/pixi.toml .config/ci/linux/pixi.lock build/runtime/work/native-linux-prerequisites/
    - cp .config/ci/linux/pixi-config.toml "$PIXI_HOME/config.toml"
    - mise exec -- pixi shell-hook --locked --shell bash --manifest-path build/runtime/work/native-linux-prerequisites/pixi.toml > build/runtime/work/native-linux-prerequisites/activation.bash
    - . build/runtime/work/native-linux-prerequisites/activation.bash
    - xz --version
    - '"$CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER" --version'

verify:linux:review:
  extends: .verify-linux
  tags:
    - ci-linux-arm64-container
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:linux:protected:
  extends: .verify-linux
  tags:
    - ci-linux-arm64-container-protected
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

.verify-macos:
  extends: .verify-native
  image: null
  resource_group: native-macos-verification
  before_script:
    - umask 022
    - test "$(uname -sm)" = "Darwin arm64"

verify:macos:review:
  extends: .verify-macos
  tags:
    - ci-macos-arm64-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:macos:protected:
  extends: .verify-macos
  tags:
    - ci-macos-arm64-shell
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

.verify-windows:
  extends: .verify-native
  image: null
  resource_group: native-windows-verification
  interruptible: true
  timeout: 60m
  variables:
    GIT_STRATEGY: clone
  before_script:
    - '$env:PATH = (Join-Path $env:ProgramFiles "mise/bin") + [IO.Path]::PathSeparator + $env:PATH'
    - node -e "if (process.platform !== 'win32' || process.arch !== 'arm64') process.exit(1)"
    - '$vsInstallation = & (Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe") -latest -products "*" -property installationPath'
    - 'if (-not $vsInstallation) { throw "Visual Studio native build installation is unavailable" }'
    - '& (Join-Path $vsInstallation "Common7/Tools/Launch-VsDevShell.ps1") -Arch arm64 -SkipAutomaticLocation'
    - 'Get-Command cl.exe, link.exe -ErrorAction Stop | Select-Object Name, Source'

verify:windows:review:
  extends: .verify-windows
  tags:
    - ci-windows-arm64-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:windows:protected:
  extends: .verify-windows
  tags:
    - ci-windows-arm64-shell
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
