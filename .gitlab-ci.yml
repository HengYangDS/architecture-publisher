image: node:26.10.0-bookworm@sha256:2aaae6d91f99fee84cfc92da9b52c22a185752d247746052bbc3f961e44478c6

variables:
  GIT_DEPTH: '0'

stages:
  - verify

.verify-linux:
  stage: verify
  interruptible: true
  script:
    - umask 022
    - node --version
    - npm --version
    - git --version
    - python3 --version
    - npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run check

verify:linux:review:
  extends: .verify-linux
  tags:
    - ci-linux-arm64-container
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:linux:protected:
  extends: .verify-linux
  tags:
    - ci-linux-arm64-container-protected
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

.verify-macos:
  stage: verify
  image: null
  resource_group: native-macos-verification
  interruptible: true
  script:
    - umask 022
    - test "$(uname -sm)" = "Darwin arm64"
    - node --version
    - npm --version
    - git --version
    - swift --version
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run check

verify:macos:review:
  extends: .verify-macos
  tags:
    - ci-macos-arm64-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:macos:protected:
  extends: .verify-macos
  tags:
    - ci-macos-arm64-shell
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'

.verify-windows:
  stage: verify
  image: null
  resource_group: native-windows-verification
  interruptible: true
  timeout: 30m
  variables:
    GIT_STRATEGY: clone
  script:
    - node -e "if (process.platform !== 'win32' || process.arch !== 'arm64') process.exit(1)"
    - node --version
    - npm --version
    - git --version
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run check

verify:windows:review:
  extends: .verify-windows
  tags:
    - ci-windows-arm64-review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH'

verify:windows:protected:
  extends: .verify-windows
  tags:
    - ci-windows-arm64-shell
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
