# Generated from .config/ci/pipeline.cue. Do not edit.

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH &&
        $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
image:
  name: hengyang2003/architecture-publisher-ci@sha256:2c7fb34278a83a3f8749776adad540588068c24a6119760d2635eb9a96d619a6
variables:
  GIT_DEPTH: "0"
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: -ffdx -e build/runtime/tool-cache/
  MISE_ENV: ci
  MISE_LOCKED: "1"
  MISE_HTTP_TIMEOUT: 180s
  MISE_DATA_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/mise
  MISE_CACHE_DIR: $CI_PROJECT_DIR/build/runtime/tool-cache/mise/cache
  MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR
  PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/build/runtime/tool-cache/playwright
  ARCHPUB_ARCHIFY_ANSWERS_ROOT: $CI_PROJECT_DIR/build/runtime/tool-cache
stages:
  - verify
.verify-native:
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/coverage-summary.json
  script:
    - mise --version
    - mise install
    - mise exec -- node --version
    - mise exec -- npm --version
    - git --version
    - mise exec -- npm ci --ignore-scripts --no-audit --no-fund
    - mise exec -- npm run generate
    - mise exec -- npm run check:ci
    - mise exec -- node node_modules/playwright-core/cli.js install chromium
    - mise exec -- node --import=./tests/fixtures/npm-environment.mjs --test
      --test-force-exit --test-name-pattern=standalone
      tests/map-browser.test.mjs
    - mise exec -- node --test --test-force-exit
      tests/conformance/journeys/command/archive.test.mjs
    - mise exec -- npm run check
  stage: verify
  interruptible: true
  timeout: 75m
.verify-linux:
  extends: .verify-native
  before_script:
    - curl --fail --silent --show-error --location --proto '=https'
      --proto-redir '=https' --connect-timeout 15 --max-time 900 --continue-at -
      --create-dirs --output
      build/runtime/tool-cache/mise/bootstrap/mise-v2026.11.14-linux-arm64
      https://github.com/jdx/mise/releases/download/v2026.11.14/mise-v2026.11.14-linux-arm64
    - sha256sum --strict --check .config/ci/linux/mise.sha256
    - install --mode=0755
      build/runtime/tool-cache/mise/bootstrap/mise-v2026.11.14-linux-arm64
      build/runtime/tool-cache/mise/bootstrap/mise
    - export PATH="$CI_PROJECT_DIR/build/runtime/tool-cache/mise/bootstrap:$PATH"
  variables:
    FF_USE_INIT_WITH_DOCKER_EXECUTOR: "true"
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"
.verify-macos:
  extends: .verify-native
  before_script: []
  variables: {}
  image: null
  resource_group: native-macos-verification
verify:linux:review:
  extends: .verify-linux
  tags:
    - ci-linux-arm64-container
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH
verify:linux:protected:
  extends: .verify-linux
  tags:
    - ci-linux-arm64-container-protected
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
verify:macos:review:
  extends: .verify-macos
  tags:
    - macos-latest
    - review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_PROTECTED != "true" && $CI_COMMIT_BRANCH
verify:macos:protected:
  extends: .verify-macos
  tags:
    - macos-latest
    - protected
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
