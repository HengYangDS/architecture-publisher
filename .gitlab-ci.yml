image: node:26.10.0-bookworm@sha256:2aaae6d91f99fee84cfc92da9b52c22a185752d247746052bbc3f961e44478c6

variables:
  GIT_DEPTH: '0'

stages:
  - verify

verify:
  stage: verify
  tags:
    - ci-linux-arm64-container
  interruptible: true
  script:
    - node --version
    - npm --version
    - git --version
    - python3 --version
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run check
