<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-label="Order service" font-family="JetBrains Mono" font-weight="400" fill="#34463f">
  <title>Order service</title>
  <desc>Editable static view; explicit node and relationship identities bind the companion JSON. Rendering does not establish implementation or browser approval.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#526a5e"/></marker></defs>
  <rect width="1200" height="730" fill="#f6f4ee"/>
  <text x="50" y="65" font-size="30" font-weight="700" fill="#34463f">Order service</text>
  <line x1="50" y1="96" x2="1150" y2="96" stroke="#bac3b8" stroke-width="1"/>
  <text x="50" y="138" font-size="14" font-weight="700" fill="#6c766d">Request and persistence</text>
  <text x="50" y="440" font-size="14" font-weight="700" fill="#6c766d">Independent event processing</text>
  <path data-edge-id="request" data-from="client" data-to="orders" d="M 250 225 H 435" fill="none" stroke="#526a5e" stroke-width="2" marker-end="url(#arrow)"/>
  <path data-edge-id="write" data-from="orders" data-to="store" d="M 715 225 H 925" fill="none" stroke="#526a5e" stroke-width="2" marker-end="url(#arrow)"/>
  <path data-edge-id="publish" data-from="orders" data-to="events" d="M 575 275 V 405" fill="none" stroke="#526a5e" stroke-width="2" marker-end="url(#arrow)"/>
  <path data-edge-id="consume" data-from="events" data-to="fulfil" d="M 715 455 H 925" fill="none" stroke="#526a5e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <g data-node-id="client">
  <rect data-node-box="client" x="50" y="175" width="200" height="100" rx="8" fill="#e6eae0" stroke="#8b998e" stroke-width="1.5"/>
  <text x="68" y="214" font-size="20" font-weight="700" fill="#34463f">Client</text>
  <text x="68" y="245" font-size="14" font-weight="400" fill="#536359">Order request</text>
  </g>
  <g data-node-id="orders">
  <rect data-node-box="orders" x="435" y="175" width="280" height="100" rx="8" fill="#e6eae0" stroke="#8b998e" stroke-width="1.5"/>
  <text x="453" y="214" font-size="20" font-weight="700" fill="#34463f">Order service</text>
  <text x="453" y="245" font-size="14" font-weight="400" fill="#536359">Validate and store</text>
  </g>
  <g data-node-id="store">
  <rect data-node-box="store" x="925" y="175" width="225" height="100" rx="8" fill="#e6eae0" stroke="#8b998e" stroke-width="1.5"/>
  <text x="943" y="214" font-size="20" font-weight="700" fill="#34463f">Order store</text>
  <text x="943" y="245" font-size="14" font-weight="400" fill="#536359">Durable records</text>
  </g>
  <g data-node-id="events">
  <rect data-node-box="events" x="435" y="405" width="280" height="100" rx="8" fill="#e6eae0" stroke="#8b998e" stroke-width="1.5"/>
  <text x="453" y="444" font-size="20" font-weight="700" fill="#34463f">Events</text>
  <text x="453" y="475" font-size="14" font-weight="400" fill="#536359">Committed orders</text>
  </g>
  <g data-node-id="fulfil">
  <rect data-node-box="fulfil" x="925" y="405" width="225" height="100" rx="8" fill="#e6eae0" stroke="#8b998e" stroke-width="1.5"/>
  <text x="943" y="444" font-size="20" font-weight="700" fill="#34463f">Fulfilment</text>
  <text x="943" y="475" font-size="14" font-weight="400" fill="#536359">Asynchronous work</text>
  </g>
  <text x="307" y="207" font-size="14" font-weight="400" fill="#34463f">submit</text>
  <text x="781" y="207" font-size="14" font-weight="400" fill="#34463f">persist</text>
  <text x="595" y="327" font-size="14" font-weight="400" fill="#34463f">publish</text>
  <text x="781" y="437" font-size="14" font-weight="400" fill="#34463f">consume</text>
  <line x1="50" y1="556" x2="1150" y2="556" stroke="#bac3b8" stroke-width="1"/>
  <text x="50" y="592" font-size="18" font-weight="700" fill="#34463f">Transaction boundary</text>
  <text x="50" y="626" font-size="14" font-weight="400" fill="#34463f">A committed order precedes its published event.</text>
  <text x="50" y="654" font-size="14" font-weight="400" fill="#34463f">Fulfilment consumes events independently of the request.</text>
</svg>
