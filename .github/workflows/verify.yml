# Generated from .config/ci/pipeline.cue. Do not edit.

name: Architecture Publisher verification
on:
  pull_request: null
  push: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  MISE_ENV: ci
  MISE_LOCKED: "1"
  MISE_HTTP_TIMEOUT: 180s
  MISE_DATA_DIR: ${{ github.workspace }}/build/runtime/tool-cache/mise
  MISE_CACHE_DIR: ${{ github.workspace }}/build/runtime/tool-cache/mise/cache
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/runtime/tool-cache/playwright
jobs:
  verify-linux-review:
    name: linux / review
    if: ${{ github.event_name == 'pull_request' || (github.ref_type == 'branch' &&
      !github.ref_protected) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-review
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b
        with:
          version: 2026.11.5
          install: false
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false
      - run: mise --version
      - run: mise install
      - run: mise exec -- node --version
      - run: mise exec -- npm --version
      - run: git --version
      - run: mise exec -- npm ci --ignore-scripts --no-audit --no-fund
      - run: mise exec -- npm run generate
      - run: mise exec -- npm run check:ci
      - run: mise exec -- node node_modules/playwright-core/cli.js install-deps chromium
      - run: mise exec -- node node_modules/playwright-core/cli.js install chromium
      - run: mise exec -- node --import=./tests/fixtures/npm-environment.mjs --test
          --test-force-exit --test-name-pattern=standalone
          tests/map-browser.test.mjs
      - run: mise exec -- node --test --test-force-exit
          tests/conformance/journeys/command/archive.test.mjs
      - run: mise exec -- npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: coverage-${{ github.job }}
          path: coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: error
