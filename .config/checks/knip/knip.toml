"$schema" = "https://unpkg.com/knip@6/schema.json"
treatConfigHintsAsErrors = true
ignoreBinaries = ["cue", "mise", "taplo"]
# Vendored or bundled by the supply tools, not imported by maintained modules.
ignoreDependencies = ["opentype.js", "@likec4/language-services", "bundle-require"]

entry = [
  "src/importers/likec4-worker.mjs",
  "tests/conformance/journeys/command/archive.test.mjs",
  "tools/release/archive.mjs",
  "tests/*.test.mjs",
]
project = ["src/**/*.mjs", "tools/**/*.mjs", "tests/**/*.mjs"]
includeEntryExports = true

[typescript]
config = ".config/checks/typescript/tsconfig.json"

[markdownlint]
config = ".config/checks/markdownlint-cli2/.markdownlint-cli2.yaml"
