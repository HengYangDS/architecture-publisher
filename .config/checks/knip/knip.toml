"$schema" = "https://unpkg.com/knip@6/schema.json"
treatConfigHintsAsErrors = true
ignoreBinaries = ["cue", "mise", "taplo"]
ignoreDependencies = ["sax", "opentype.js"]

[typescript]
config = ".config/checks/typescript/tsconfig.json"

[markdownlint]
config = ".config/checks/markdownlint-cli2/.markdownlint-cli2.yaml"

[workspaces."."]
entry = [
  "tests/conformance/journeys/raster/rebuild.test.mjs",
  "tools/raster/resvg/verify.mjs",
  "tests/*.test.mjs",
]
project = ["tools/**/*.mjs", "tests/**/*.mjs"]
includeEntryExports = true

[workspaces."packages/publisher"]
entry = ["src/importers/likec4-worker.mjs"]
project = ["src/**/*.mjs"]
includeEntryExports = false
