globs:
  - "*.md"
  - "**/README.md"
  - docs/**/*.md
  - openspec/**/*.md
  - skills/**/*.md
gitignore: .gitignore
ignores:
  - .git/**
  - openspec/changes/archive/**
  - tests/fixtures/**
  - "**/supply/**"
  - packages/publisher/supplies/**
noInlineConfig: true
config:
  default: true
  MD012:
    maximum: 1
  MD013: false
  MD024:
    siblings_only: true
  MD033: false
  MD041: false
