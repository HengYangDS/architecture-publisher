[env]
MISE_RUSTUP_HOME = "{{config_root}}/build/runtime/tool-cache/rustup"
MISE_CARGO_HOME = "{{config_root}}/build/runtime/tool-cache/cargo"
ARCHPUB_RESVG_SOURCE_ARCHIVE = "{{config_root}}/build/runtime/tool-cache/raster/source.tar.xz"
PLAYWRIGHT_BROWSERS_PATH = "{{config_root}}/build/runtime/tool-cache/playwright"
ARCHPUB_RESVG_BINDGEN = { value = "{% set tool = tools['github:wasm-bindgen/wasm-bindgen'] %}{% if tool is map %}{{tool.path}}{% else %}{{tool[0].path}}{% endif %}/wasm-bindgen{% if os() == 'windows' %}.exe{% endif %}", tools = true }
_.path = { path = [
  "{% set tool = tools['npm:npm'] %}{% if tool is map %}{{tool.path}}{% else %}{{tool[0].path}}{% endif %}/node_modules/.bin",
], tools = true }

[tools]
node = "{{read_file(path=config_root ~ '/.node-version') | trim}}"
"npm:npm" = "12.2.0"
pixi = { version = "0.81.0", os = ["linux/arm64"] }
rust = { version = "1.99.0", profile = "minimal", components = [
  "cargo",
  "rust-std",
  "rustc",
], targets = [
  "wasm32-unknown-unknown",
] }

[tools."github:wasm-bindgen/wasm-bindgen"]
version = "0.2.129"
matching_regex = "^wasm-bindgen-[0-9.]+-(aarch64-apple-darwin|aarch64-unknown-linux-gnu|x86_64-pc-windows-msvc)\\.tar\\.gz$"
strip_components = 1

[tools."github:wasm-bindgen/wasm-bindgen".platforms.windows-arm64]
asset_pattern = "wasm-bindgen-0.2.129-x86_64-pc-windows-msvc.tar.gz"
checksum = "sha256:79e348c169d0c10c0b287647f1e753d0985353ca96800bc29be8f4261baf13e6"
