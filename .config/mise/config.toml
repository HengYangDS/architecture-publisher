[settings]
locked = true
minimum_release_age = "24h"

[tasks.bootstrap]
description = "Install locked development dependencies"
run = ["npm ci --ignore-scripts --no-audit --no-fund", "npm run generate"]

[tasks.check]
description = "Verify the complete native quality graph"
run = "npm run check"

[tasks.fix]
description = "Format the maintained inputs through their native owners"
run = "npm run format"

# npm reads this repository's own configuration, which holds npm's release age. npm treats
# environment names case-insensitively, so its lower-case alias is removed.
[env]
npm_config_userconfig = false
NPM_CONFIG_USERCONFIG = "{{ config_root }}/.config/npm/npmrc"
PLAYWRIGHT_BROWSERS_PATH = "{{ get_env(name='PLAYWRIGHT_BROWSERS_PATH', default=config_root ~ '/build/runtime/tool-cache/playwright') }}"

[tools]
cue = "0.17.1"
typst = "0.15.1"
"npm:npm" = "12.2.3"
node = "26.13.1"

# The ETHOS release declaration as published with v0.2.0-beta.11.
[tools."http:ethos"]
version = "0.2.0-beta.11"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.11/ethos-0.2.0-beta.11-linux-arm64.tar.gz", checksum = "sha256:d619560f9cd7812303d550721722afa200b2bc152639ec5ac3ab68ef2d50b292", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.11/ethos-0.2.0-beta.11-linux-x64.tar.gz", checksum = "sha256:d8eb1d563015d624fee5d4fbf3b3f50e952e8e9cf603262bbd5d337ff808c30d", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.11/ethos-0.2.0-beta.11-macos-arm64.tar.gz", checksum = "sha256:59a2b154e82b9fb5a5f94f12cba6eb5825102235a7e4e802b60bafe82f8b966e", bin_path = "ethos/bin" }

[tools."github:tamasfe/taplo"]
