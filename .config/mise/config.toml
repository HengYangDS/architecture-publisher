[settings]
locked = true

[tasks.bootstrap]
description = "Install locked development dependencies"
run = ["npm ci --ignore-scripts --no-audit --no-fund", "npm run generate"]

[tasks.check]
description = "Verify the complete native quality graph"
run = "npm run check"

[tasks.fix]
description = "Format the maintained inputs through their native owners"
run = "npm run format"

[env]
PLAYWRIGHT_BROWSERS_PATH = "{{ get_env(name='PLAYWRIGHT_BROWSERS_PATH', default=config_root ~ '/build/runtime/tool-cache/playwright') }}"

[tools]
cue = "0.17.1"
typst = "0.15.1"
"npm:npm" = "12.2.2"
node = "26.13.1"

